<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sessão - Casa do Ló</title>
</head>
<body style="background-color: #FFF8F0; font-family: sans-serif; padding: 50px; text-align: center;">

    <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: left;">
        <h2 style="color: #8B4513; text-align: center; margin-bottom: 20px;">🔑 Iniciar Sessão</h2>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; color: #7f5539; margin-bottom: 5px;">E-mail:</label>
                <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-weight: bold; color: #7f5539; margin-bottom: 5px;">Palavra-passe:</label>
                <input type="password" name="senha" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <button type="submit" style="background: #7f5539; color: white; padding: 12px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em;">Entrar</button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 0.9em; color: #666;">
            Ainda não tem conta? <a href="{{ url_for('registo') }}" style="color: #8B4513; font-weight: bold; text-decoration: none;">Registe-se aqui</a>
        </p>
    </div>

</body>
</html>
